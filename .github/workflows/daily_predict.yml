name: Daily Market AI Predictions

on:
  schedule:
    - cron: '0 13 * * 1-5' # Runs Monday through Friday at 1:00 PM UTC (market open)
  workflow_dispatch: # Allows you to trigger it manually anytime from GitHub

jobs:
  run-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install streamlit pandas numpy yfinance scikit-learn lightgbm vaderSentiment supabase

      - name: Run daily prediction script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python run_daily.py
